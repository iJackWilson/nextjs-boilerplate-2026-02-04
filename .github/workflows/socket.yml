name: Socket Security Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: 

jobs:
  socket:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: SocketDev/socket-basics@v1.0.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          socket_security_api_key: ${{ secrets.SOCKET_SECURITY_API_KEY }}
